<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Камень, ножницы, бумага</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:minmax(88px,1fr) auto;gap:8px;padding:8px 12px 12px;background:#f5f9f8;color:#18394a;font:600 16px/1.3 system-ui,sans-serif;text-align:center}.preview{position:relative;overflow:hidden;border-radius:18px;background:#193649}video{width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}output{position:absolute;inset:0;display:grid;place-items:center;color:white;font:bold 4rem system-ui;text-shadow:0 2px 10px #152732}p{margin:4px}button{min-height:44px;border:0;border-radius:12px;background:#126958;color:white;padding:6px 22px;font:inherit}button:disabled{opacity:.55}#score{font-size:.9rem}#choices{font-size:1.35rem}
</style></head><body>
<div class="preview"><video playsinline muted autoplay></video><output aria-hidden="true"></output></div>
<section><p id="score">Ты 0 · 0 Компьютер</p><p id="choices" hidden></p><p id="message" role="status">Включаем камеру…</p><button id="round" disabled>Начать раунд</button></section>
<script src="game.js"></script></body></html>
