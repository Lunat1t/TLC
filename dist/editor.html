<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8fa">
  <title>Редактор — TLC</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="editor-shell">
    <header class="editor-topbar">
      <a class="back-link" href="index.html" aria-label="К списку проектов">← <span>Проекты</span></a>
      <div class="project-heading"><strong id="projectTitle">Проект</strong><span id="projectHub"></span></div>
      <span id="saveState" class="save-state" role="status">Сохранено</span>
      <button id="bluetoothButton" class="bluetooth-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg> Bluetooth</button>
    </header>

    <div class="editor-body">
      <aside id="palette" class="palette" aria-label="Меню блоков">
        <div class="palette-heading"><div><small>БИБЛИОТЕКА</small><h2>Блоки</h2></div><button id="closePalette" class="icon-button close-palette" type="button" aria-label="Закрыть меню">×</button></div>
        <button id="categoryToggle" class="category-toggle" type="button" aria-expanded="true" aria-controls="blockCategory"><span>Основные</span><span id="categoryChevron" aria-hidden="true">⌄</span></button>
        <div id="blockCategory" class="block-category">
          <button id="emptyBlock" class="palette-block" type="button" aria-label="Добавить пустой блок. Можно перетащить на доску"><span class="block-preview" aria-hidden="true"></span><span>Пустой блок</span><small>Перетащите на доску</small></button>
        </div>
      </aside>
      <button id="paletteBackdrop" class="palette-backdrop" type="button" aria-label="Закрыть меню блоков" hidden></button>

      <main class="board-panel">
        <div class="board-toolbar"><button id="openPalette" class="icon-button menu-button" type="button" aria-label="Открыть меню блоков" aria-expanded="false">☰</button><span class="board-title">Рабочая область</span><span class="toolbar-spacer"></span><button id="zoomOut" class="icon-button" type="button" aria-label="Уменьшить масштаб">−</button><span id="zoomValue" class="zoom-value">100%</span><button id="zoomIn" class="icon-button" type="button" aria-label="Увеличить масштаб">+</button><button id="resetView" class="reset-view" type="button">По центру</button></div>
        <div id="board" class="board" aria-label="Доска для блоков"><div id="blockLayer" class="block-layer"></div><div id="boardHint" class="board-hint">Перетащите блок из меню на доску<br><small>Доску можно двигать, удерживая пустое место</small></div></div>
      </main>
    </div>
  </div>

  <dialog id="bluetoothDialog" class="info-dialog" aria-labelledby="bluetoothTitle"><h2 id="bluetoothTitle">Bluetooth</h2><p id="bluetoothMessage">Подключение робота в редакторе появится позже. Блоки сейчас сохраняются без соединения с хабом.</p><div class="dialog-actions"><a id="legacyController" href="controller.html">Открыть прежний пульт</a><button id="closeBluetooth" type="button">Понятно</button></div></dialog>
  <script type="module" src="editor.js"></script>
</body>
</html>
